[build]
  functions = "netlify/functions"

# Redirect root to Discord
[[redirects]]
  from = "/"
  to = "https://discord.gg/lol"
  status = 301
  force = true

# Rewrite /admin to the function
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/loader?page=admin"
  status = 200
  force = true

# Catch-all redirect to Discord
[[redirects]]
  from = "/*"
  to = "https://discord.gg/lol"
  status = 301
  force = true
